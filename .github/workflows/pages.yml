name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Prepare docs directory
        run: |
          # Copy doc source directories into docs/ for MkDocs
          for dir in R E G C Playbook examples; do
            cp -R "$dir" docs/
          done
          # Ensure images are available
          mkdir -p docs/img
          cp -R docs/img/* docs/img/ 2>/dev/null || true

      - name: Build docs site
        run: mkdocs build

      - name: Merge landing page + docs
        run: |
          mkdir -p _site
          cp -R landing/* _site/
          cp -R docs_site _site/docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
